<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Aino application icon</title>
  <desc id="desc">A cobalt and indigo rounded-square icon with a luminous A-shaped agent mark.</desc>
  <defs>
    <linearGradient id="bg" x1="104" y1="72" x2="904" y2="952" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#176BFF"/>
