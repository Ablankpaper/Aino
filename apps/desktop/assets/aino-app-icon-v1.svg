      <stop offset="1" stop-color="#3320A8"/>
    </linearGradient>
    <radialGradient id="halo" cx="0" cy="0" r="1" gradientTransform="translate(252 156) rotate(42) scale(500)">
      <stop stop-color="#7DEBFF" stop-opacity="0.42"/>
