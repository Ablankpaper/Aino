<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Aino application icon, open folio</title>
  <desc id="desc">A soft mint and teal tile with a warm open folio mark and integrated bookmark.</desc>
  <defs>
    <linearGradient id="background" x1="120" y1="72" x2="900" y2="952" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#B9F0C5"/>
      <stop offset="0.42" stop-color="#55D2BA"/>
      <stop offset="1" stop-color="#1D8993"/>
    </linearGradient>
    <radialGradient id="topGlow" cx="0" cy="0" r="1" gradientTransform="translate(230 128) rotate(38) scale(560)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F2FFD3" stop-opacity="0.72"/>
      <stop offset="1" stop-color="#F2FFD3" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="paper" x1="258" y1="244" x2="744" y2="756" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFCF1"/>
      <stop offset="0.58" stop-color="#FFF4DE"/>
      <stop offset="1" stop-color="#F4E5C7"/>
    </linearGradient>
    <linearGradient id="bookmark" x1="662" y1="258" x2="742" y2="484" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFD27A"/>
      <stop offset="0.56" stop-color="#FFAA67"/>
      <stop offset="1" stop-color="#F07B63"/>
    </linearGradient>
    <filter id="tileShadow" x="-20%" y="-20%" width="140%" height="150%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="24" stdDeviation="26" flood-color="#0A4F5A" flood-opacity="0.28"/>
    </filter>
    <filter id="folioShadow" x="-20%" y="-20%" width="140%" height="150%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="22" stdDeviation="18" flood-color="#0A5B62" flood-opacity="0.25"/>
    </filter>
    <clipPath id="tileClip">
      <rect x="48" y="48" width="928" height="928" rx="236"/>
    </clipPath>
  </defs>

  <rect x="48" y="48" width="928" height="928" rx="236" fill="#126873" filter="url(#tileShadow)"/>
  <g clip-path="url(#tileClip)">
    <rect x="48" y="48" width="928" height="928" fill="url(#background)"/>
    <rect x="48" y="48" width="928" height="928" fill="url(#topGlow)"/>
    <path d="M30 816C222 694 366 796 542 740s304-166 502-56v344H30Z" fill="#0A6877" opacity="0.16"/>
    <path d="M50 240C242 170 390 214 544 150s302-56 450 22V48H50Z" fill="#F5FFDB" opacity="0.14"/>
  </g>

  <rect x="64" y="64" width="896" height="896" rx="220" fill="none" stroke="#F5FFEA" stroke-opacity="0.34" stroke-width="8"/>

  <!-- The open folio is a single, friendly silhouette: two pages meet at a soft fold. -->
  <g filter="url(#folioShadow)">
    <path d="M512 296C490 266 464 248 424 248H334C268 248 218 300 218 364V620C218 688 264 738 330 738H430C466 738 492 726 512 702C532 726 558 738 594 738H694C760 738 806 688 806 620V364C806 300 756 248 690 248H600C560 248 534 266 512 296Z" fill="url(#paper)"/>
  </g>

  <!-- A shallow fold keeps the two pages legible without making a letterform. -->
  <path d="M512 306C496 334 490 366 490 404V683C498 690 505 697 512 706C519 697 526 690 534 683V404C534 366 528 334 512 306Z" fill="#E9D9BB" opacity="0.64"/>
  <path d="M512 316V694" fill="none" stroke="#D5C39F" stroke-opacity="0.82" stroke-width="10" stroke-linecap="round"/>

  <!-- A bookmark is part of the page, not a detached decorative node. -->
  <path d="M662 258H742V480L702 448L662 480V258Z" fill="url(#bookmark)"/>
  <path d="M662 258H742" fill="none" stroke="#FFF3D8" stroke-opacity="0.72" stroke-width="8" stroke-linecap="round"/>

  <!-- Two quiet page rules give the mark a work-document cue at larger sizes. -->
  <g fill="none" stroke="#43A996" stroke-linecap="round" stroke-width="18" opacity="0.76">
    <path d="M294 452H422"/>
    <path d="M294 516H422"/>
    <path d="M602 548H730"/>
    <path d="M602 612H704"/>
  </g>
  <path d="M294 580H378" fill="none" stroke="#F0A06B" stroke-linecap="round" stroke-width="18" opacity="0.9"/>
</svg>
